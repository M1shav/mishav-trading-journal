            )}

            {showSessionModal && (
              <div className="fixed inset-0 bg-black/80 z-50 flex justify-center items-center p-4">
                <div className="bg-bgPanel w-full max-w-md border border-bgBorder rounded-md flex flex-col max-h-[90vh] shadow-2xl">
                  
                  <div className="p-4 border-b border-bgBorder flex justify-between items-center">
                    <h3 className="font-bold text-textMain uppercase tracking-wider">Session Times</h3>
                    <button type="button" onClick={() => setShowSessionModal(false)} className="text-textMuted hover:text-textMain text-xl leading-none">&times;</button>
                  </div>
                  
                  <div className="p-6 overflow-y-auto flex-1 space-y-6">
                    {sessError && <div className="bg-loss/10 border border-loss text-loss p-3 rounded text-xs font-bold uppercase tracking-wider text-center">{sessError}</div>}
                    
                    <div className="space-y-6">
                      {['Asia', 'London', 'NewYork'].map(sKey => (
                        <div key={sKey} className="bg-[#11161D] border border-bgBorder p-4 rounded">
                          <h4 className="text-xs font-bold text-textMain uppercase tracking-wider mb-4 border-b border-bgBorder pb-2">
                            {sKey === 'NewYork' ? 'New York' : sKey} Session
                          </h4>
                          <div className="grid grid-cols-2 gap-4">
                            <TimePicker label="Start Time" value={tempSess[sKey].start} onChange={(val) => setTempSess({...tempSess, [sKey]: {...tempSess[sKey], start: val}})} isCompact={true} />
                            <TimePicker label="End Time" value={tempSess[sKey].end} onChange={(val) => setTempSess({...tempSess, [sKey]: {...tempSess[sKey], end: val}})} isCompact={true} />
                          </div>
                        </div>
                      ))}
                    </div>

                  </div>
                  
                  <div className="p-4 border-t border-bgBorder flex justify-end gap-3 bg-[#080A0D] rounded-b-md">
                    <button type="button" onClick={() => setShowSessionModal(false)} className="px-4 py-2 text-sm font-bold text-textMuted hover:text-textMain transition-colors">Cancel</button>
                    <button type="button" onClick={handleSaveSessions} className="bg-accent hover:bg-[#00cce6] text-[#080A0D] px-6 py-2 rounded text-sm font-bold transition-all shadow-[0_0_15px_rgba(0,229,255,0.2)]">Save Session Times</button>
                  </div>
                </div>
              </div>
            )}
          </div>

        </div>
      );
    };

    // --- GOALS MODULE ---
    const GoalsView = ({ trades, startingBalance, goals, saveGoal, deleteGoal }) => {
      const [showModal, setShowModal] = useState(false);
      const [editingId, setEditingId] = useState(null);

      const defaultForm = { name: '', description: '', type: 'Custom', deadline: '', target: '', current: '' };
      const [form, setForm] = useState(defaultForm);

      const stats = useMemo(() => {
        let net = 0, wins = 0, losses = 0, grossWin = 0, grossLoss = 0, maxDd = 0, peak = 0;
        let currentMonthPnl = 0;
        let totalRulesFollowed = 0;
        let totalRulesPossible = 0;
        let totalR = 0;

        const now = new Date();
        const currentMonth = now.getMonth();
        const currentYear = now.getFullYear();

        trades.forEach(t => {
          net += t.pnl;
          if (net > peak) peak = net;
          if (peak - net > maxDd) maxDd = peak - net;
          
          if (t.result === 'WIN') { wins++; grossWin += t.pnl; }
          if (t.result === 'LOSS') { losses++; grossLoss += Math.abs(t.pnl); }

          const tDate = new Date(t.date);
          if (tDate.getMonth() === currentMonth && tDate.getFullYear() === currentYear) {
            currentMonthPnl += t.pnl;
          }

          const ruleCount = t.rulesFollowed !== undefined ? t.rulesFollowed : (t.checklist ? Object.values(t.checklist).filter(Boolean).length : 0);
          totalRulesFollowed += ruleCount;
          totalRulesPossible += 5;

          if (t.r !== undefined) totalR += parseFloat(t.r) || 0;
        });

        const winRate = trades.length ? ((wins / trades.length) * 100) : 0;
        const pf = grossLoss > 0 ? (grossWin / grossLoss) : (grossWin > 0 ? 99 : 0);
        const ruleAdherence = totalRulesPossible > 0 ? ((totalRulesFollowed / totalRulesPossible) * 100) : 0;

        return {
          'Account Balance': startingBalance + net,
          'Net P&L': net,
          'Monthly P&L': currentMonthPnl,
          'Win Rate': winRate,
          'Profit Factor': pf,
          'Maximum Drawdown': maxDd, 
          'Number of Trades': trades.length,
          'R Multiple': totalR,
          'Rule Adherence': ruleAdherence
        };
      }, [trades, startingBalance]);

      const handleSave = (e) => {
        e.preventDefault();
        const newGoal = {
          ...form,
          id: editingId || crypto.randomUUID(),
          target: parseFloat(form.target) || 0,
          current: form.current === '' ? '' : parseFloat(form.current)
        };
        saveGoal(newGoal);
        setShowModal(false);
        setForm(defaultForm);
        setEditingId(null);
      };

      const handleDelete = (id) => { if(confirm('Delete goal?')) deleteGoal(id); };
      
      const handleEdit = (g) => { 
        setForm({
          name: g.name || '',
          description: g.description || g.notes || '',
          type: g.type || 'Custom',
          deadline: g.deadline || '',
          target: g.target || '',
          current: g.current !== undefined ? g.current : (g.customCurrent || '')
        });
        setEditingId(g.id);
        setShowModal(true);
      };

      const formatGoalValue = (val, type) => {
        if (['Account Balance', 'Net P&L', 'Monthly P&L', 'Maximum Drawdown'].includes(type)) return formatMoney(val);
        if (['Win Rate', 'Rule Adherence'].includes(type)) return `${val.toFixed(1)}%`;
        if (['Profit Factor', 'R Multiple'].includes(type)) return val.toFixed(2);
        return val.toString();
      };

      return (
        <div className="space-y-6">
          <div className="flex justify-between items-center mb-6">
            <div>
              <h2 className="text-lg font-semibold uppercase tracking-wider text-textMain">Goals</h2>
            </div>
            <button onClick={() => { setForm(defaultForm); setEditingId(null); setShowModal(true); }} className="bg-accent hover:bg-[#00cce6] text-[#080A0D] px-4 py-2 rounded text-sm font-bold flex items-center gap-2 transition-colors shrink-0">
              <Icons.Plus /> Add Goal
            </button>
          </div>

          {goals.length === 0 && (
            <div className="text-center p-12 bg-bgPanel border border-bgBorder rounded-md text-textMuted">
              No goals set yet. Click "Add Goal" to begin tracking your targets.
            </div>
          )}

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {goals.map(g => {
              
              let currentNum = (g.current !== '' && g.current !== undefined && !isNaN(g.current)) 
                  ? parseFloat(g.current) 
                  : (stats[g.type] || 0);

              const targetNum = parseFloat(g.target) || 0;
              
              let progress = targetNum !== 0 ? (currentNum / targetNum) * 100 : 0;
              let isCompleted = false;

              if (g.type === 'Maximum Drawdown') {
                progress = targetNum > 0 ? (currentNum / targetNum) * 100 : 0;
                if (currentNum >= targetNum && targetNum > 0) isCompleted = true; // Breached negative limit
              } else {
                if (currentNum >= targetNum && targetNum > 0) isCompleted = true;
                if (currentNum <= targetNum && targetNum < 0) isCompleted = true; 
              }

              // Clamp strictly between 0 and 100 for display
              const displayProgress = Math.min(Math.max(progress, 0), 100).toFixed(0);
              
              let barColor = isCompleted ? 'bg-profit' : 'bg-accent';
              let textColor = isCompleted ? 'text-profit' : 'text-accent';

              if (g.type === 'Maximum Drawdown' && isCompleted) {
                 barColor = 'bg-loss';
                 textColor = 'text-loss';
              }

              let valueDisplay = '';
              if (g.type === 'Percentage') {
                  valueDisplay = `${currentNum}% / ${targetNum}%`;
              } else if (g.type === 'Trades') {
                  valueDisplay = `${currentNum} trades / ${targetNum} trades`;
              } else {
                  valueDisplay = `${formatGoalValue(currentNum, g.type)} / ${formatGoalValue(targetNum, g.type)}`;
              }

              return (
                <div key={g.id} className="bg-bgPanel border border-bgBorder rounded-md p-5 flex flex-col relative transition-colors shadow-sm">
                  
                  <div className="flex justify-between items-start mb-6">
                     <h3 className="font-bold text-textMain uppercase tracking-wider text-sm pr-4 truncate">{g.name}</h3>
                     <span className="px-2 py-0.5 border border-bgBorder rounded text-[9px] text-textMuted uppercase font-bold tracking-widest shrink-0">{g.type}</span>
                  </div>

                  <div className="mb-4">
                     <div className="text-2xl font-bold font-mono text-textMain mb-4">
                        {valueDisplay}
                     </div>

                     <div className="flex justify-between items-end mb-2">
                        <span className="text-xs text-textMuted">{displayProgress}% complete</span>
                        <span className={`text-sm font-bold font-mono ${textColor}`}>{displayProgress}%</span>
                     </div>

                     <div className="h-2 w-full bg-bgMain rounded-full overflow-hidden border border-[#080A0D]">
                        <div className={`h-full ${barColor} transition-all duration-300`} style={{width: `${displayProgress}%`}}></div>
                     </div>
                  </div>

                  <div className="flex justify-between items-center mt-auto pt-4 border-t border-bgBorder">
                     <div className="text-xs text-textMuted">
                        {g.deadline ? `Deadline: ${formatDate(g.deadline)}` : 'No deadline'}
                     </div>
                     <div className="flex gap-2 shrink-0">
                       <button onClick={() => handleEdit(g)} className="px-3 py-1.5 bg-bgMain border border-bgBorder hover:border-textDark rounded text-xs text-textMain transition-colors">Edit</button>
                       <button onClick={() => handleDelete(g.id)} className="px-3 py-1.5 bg-[#2A1519] border border-loss hover:bg-loss hover:text-white rounded text-xs text-loss transition-colors">Delete</button>
                     </div>
                  </div>
                </div>
              );
            })}
          </div>

          {/* Goal Modal */}
          {showModal && (
            <div className="fixed inset-0 bg-black/80 z-50 flex justify-center items-center p-4">
              <div className="bg-bgPanel w-full max-w-md border border-bgBorder rounded-md flex flex-col max-h-[90vh]">
                
                <div className="p-4 border-b border-bgBorder flex justify-between items-center">
                  <h3 className="font-bold text-textMain uppercase tracking-wider">{editingId ? 'Edit Goal' : 'New Goal'}</h3>
                  <button type="button" onClick={() => setShowModal(false)} className="text-textMuted hover:text-textMain text-xl leading-none">&times;</button>
                </div>
                
                <div className="p-6 overflow-y-auto flex-1 space-y-4">
                  <form id="goalForm" onSubmit={handleSave} className="space-y-4">
                    
                    <div>
                      <label className="block text-xs text-textMuted mb-1">Goal Name</label>
                      <input type="text" required placeholder="e.g. DAILY PIPS GOAL" className="w-full bg-bgMain border border-bgBorder rounded p-2 text-sm text-textMain focus:border-accent outline-none" value={form.name} onChange={e=>setForm({...form, name:e.target.value})}/>
                    </div>

                    <div>
                      <label className="block text-xs text-textMuted mb-1">Description (optional)</label>
                      <textarea rows="3" className="w-full bg-bgMain border border-bgBorder rounded p-2 text-sm text-textMain focus:border-accent outline-none resize-none" value={form.description} onChange={e=>setForm({...form, description:e.target.value})}></textarea>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs text-textMuted mb-1">Goal Type</label>
                        <select className="w-full bg-bgMain border border-bgBorder rounded p-2 text-sm text-textMain focus:border-accent outline-none" value={form.type} onChange={e=>setForm({...form, type:e.target.value})}>
                          {GOAL_TYPES.map(p=><option key={p} value={p}>{p}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs text-textMuted mb-1">Deadline (optional)</label>
                        <input type="date" className="w-full bg-bgMain border border-bgBorder rounded p-2 text-sm text-textMain focus:border-accent outline-none" value={form.deadline} onChange={e=>setForm({...form, deadline:e.target.value})}/>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs text-textMuted mb-1">Target Value</label>
                        <input type="number" step="any" required className="w-full bg-bgMain border border-bgBorder rounded p-2 text-sm text-textMain focus:border-accent outline-none font-mono" value={form.target} onChange={e=>setForm({...form, target:e.target.value})}/>
                      </div>
                      <div>
                        <label className="block text-xs text-textMuted mb-1">Current Value</label>
                        <input type="number" step="any" placeholder="Auto if blank" className="w-full bg-bgMain border border-bgBorder rounded p-2 text-sm text-textMain focus:border-accent outline-none font-mono" value={form.current} onChange={e=>setForm({...form, current:e.target.value})}/>
                      </div>
                    </div>
                    
                  </form>
                </div>
                
                <div className="p-4 border-t border-bgBorder flex justify-end gap-3 bg-[#11161D] rounded-b-md">
                  <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2 text-sm font-bold text-textMuted hover:text-textMain transition-colors">Cancel</button>
                  <button type="submit" form="goalForm" className="bg-accent hover:bg-[#00cce6] text-[#080A0D] px-6 py-2 rounded text-sm font-bold transition-all">Save Goal</button>
                </div>

              </div>
            </div>
          )}
        </div>
      );
    };

    // --- SETTINGS ---
    const SettingsView = ({ trades, setTrades, startingBalance, updateSettings }) => {
      const [localBalance, setLocalBalance] = useState(startingBalance);

      const handleSaveBalance = () => {
        const parsed = parseFloat(localBalance);
        if (!isNaN(parsed) && parsed >= 0) {
          updateSettings({ balance: parsed });
          alert("Starting balance successfully updated!");
        } else {
          alert("Please enter a valid positive number for the starting balance.");
          setLocalBalance(startingBalance);
        }
      };

      const handleExport = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(trades));
        const anchor = document.createElement('a'); anchor.href = dataStr; anchor.download = "mishav_journal_backup.json"; anchor.click();
      };
      
      const handleImport = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if(Array.isArray(imported)) { 
               // Assuming user wants to replace locally, but this is complicated by cloud. 
               // For now, alert to prevent breaking cloud sync unless explicitly coded for cloud replace.
               alert("Import feature requires manual cloud database update in this version."); 
            }
          } catch(err) { alert("Invalid JSON file."); }
        };
        reader.readAsText(file);
      };

      return (
        <div className="max-w-xl space-y-6">
          <h2 className="text-lg font-semibold uppercase tracking-wider text-textMain">Settings & Data</h2>
          
          <div className="bg-bgPanel border border-bgBorder rounded-md p-6 space-y-6 shadow-sm">
            <div>
              <h3 className="text-textMain text-sm uppercase tracking-wider mb-2">Account Configuration</h3>
              <div className="space-y-4">
                <div>
                  <label className="block text-xs text-textMuted mb-1">Starting Balance ($)</label>
                  <div className="flex gap-3">
                    <input 
                      type="number" 
                      step="0.01" 
                      value={localBalance} 
                      onChange={(e) => setLocalBalance(e.target.value)} 
                      className="w-full bg-bgMain border border-bgBorder rounded p-2 text-sm text-textMain font-mono focus:border-accent outline-none"
                    />
                    <button 
                      onClick={handleSaveBalance} 
                      className="bg-accent hover:bg-[#00cce6] text-[#080A0D] px-6 py-2 rounded text-sm font-bold transition-colors"
                    >
                      Save
                    </button>
                  </div>
                  <p className="text-[10px] text-textDark mt-1">This balance determines your percentage returns and drawdown statistics.</p>
                </div>
                <div>
                  <label className="block text-xs text-textMuted mb-1">Account Currency</label>
                  <input type="text" disabled value="USD" className="w-full bg-bgMain border border-bgBorder rounded p-2 text-sm text-textDark cursor-not-allowed"/>
                </div>
              </div>
            </div>
            
            <div className="pt-4 border-t border-bgBorder">
              <h3 className="text-textMain text-sm uppercase tracking-wider mb-4">Data Management</h3>
              <div className="flex gap-4">
                <button onClick={handleExport} className="bg-bgMain border border-bgBorder hover:border-accent text-textMain px-4 py-2 rounded text-sm transition-colors flex-1">Export JSON</button>
                <label className="bg-bgMain border border-bgBorder hover:border-accent text-textMain px-4 py-2 rounded text-sm transition-colors cursor-pointer flex-1 text-center opacity-50">
                  Import JSON (Disabled)
                  <input type="file" accept=".json" className="hidden" disabled />
                </label>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 5. SUPABASE AUTH & SETUP VIEWS
    // ==========================================
    const SetupScreen = ({ onComplete }) => {
      const [url, setUrl] = useState('');
      const [key, setKey] = useState('');
      
      const handleSave = () => {
         if(!url || !key) return alert('Both fields required');
         localStorage.setItem('mishav_supabase_url', url);
         localStorage.setItem('mishav_supabase_key', key);
         onComplete();
      };

      const sql = `-- Run this in your Supabase SQL Editor:
create table public.trades (
  id text primary key,
  user_id uuid references auth.users not null,
  data jsonb not null,
  created_at timestamp with time zone default timezone('utc'::text, now()) not null
);

create table public.goals (
  id text primary key,
  user_id uuid references auth.users not null,
  data jsonb not null,
  created_at timestamp with time zone default timezone('utc'::text, now()) not null
);

create table public.settings (
  user_id uuid references auth.users primary key,
  balance numeric default 50000,
  dashboard_target numeric default 8,
  dashboard_target_type text default 'Percentage',
  session_settings jsonb default '{"configured": false, "sessions": {"Asia": {"end": {"a": "AM", "h": "11", "m": "30"}, "start": {"a": "AM", "h": "7", "m": "00"}}, "London": {"end": {"a": "PM", "h": "4", "m": "30"}, "start": {"a": "PM", "h": "1", "m": "00"}}, "NewYork": {"end": {"a": "PM", "h": "8", "m": "30"}, "start": {"a": "PM", "h": "5", "m": "30"}}}}'::jsonb
);

alter table public.trades enable row level security;
alter table public.goals enable row level security;
alter table public.settings enable row level security;

create policy "Enable full access for users based on user_id" on public.trades for all using (auth.uid() = user_id) with check (auth.uid() = user_id);
create policy "Enable full access for users based on user_id" on public.goals for all using (auth.uid() = user_id) with check (auth.uid() = user_id);
create policy "Enable full access for users based on user_id" on public.settings for all using (auth.uid() = user_id) with check (auth.uid() = user_id);

alter publication supabase_realtime add table trades;
alter publication supabase_realtime add table goals;
alter publication supabase_realtime add table settings;`;

      return (
         <div className="flex h-screen items-center justify-center bg-bgMain text-textMain p-4 overflow-y-auto">
            <div className="bg-bgPanel border border-bgBorder rounded-md p-8 max-w-3xl w-full shadow-2xl my-auto">
               <h1 className="text-xl font-bold uppercase tracking-wider mb-2 text-accent">Database Setup Required</h1>
               <p className="text-sm text-textMuted mb-6">Enter your Supabase credentials to enable cloud synchronization. Your API keys are stored locally in your browser.</p>
               
               <div className="space-y-4 mb-8">
                  <div>
                    <label className="block text-xs text-textMuted mb-1">Supabase Project URL</label>
                    <input type="text" placeholder="https://your-project.supabase.co" className="w-full bg-bgMain border border-bgBorder rounded p-3 text-sm text-textMain focus:border-accent outline-none font-mono" value={url} onChange={e=>setUrl(e.target.value)}/>
                  </div>
                  <div>
                    <label className="block text-xs text-textMuted mb-1">Supabase Anon Key (Public)</label>
                    <input type="password" placeholder="ey..." className="w-full bg-bgMain border border-bgBorder rounded p-3 text-sm text-textMain focus:border-accent outline-none font-mono" value={key} onChange={e=>setKey(e.target.value)}/>
                  </div>
               </div>

               <button onClick={handleSave} className="w-full bg-accent hover:bg-[#00cce6] text-[#080A0D] px-6 py-3 rounded text-sm font-bold transition-all mb-8 shadow-[0_0_15px_rgba(0,229,255,0.2)]">Connect to Supabase</button>
               
               <div className="border-t border-bgBorder pt-6">
                  <h3 className="text-sm font-bold text-textMain mb-2 uppercase">Required SQL Schema</h3>
                  <p className="text-xs text-textMuted mb-3">You must run this SQL in your Supabase SQL Editor before connecting.</p>
                  <pre className="bg-[#080A0D] border border-bgBorder p-4 rounded text-[10px] text-textDark overflow-x-auto font-mono">
                     {sql}
                  </pre>
               </div>
            </div>
         </div>
      );
    }

    const AuthScreen = ({ supabase }) => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [isSignUp, setIsSignUp] = useState(false);

      const handleAuth = async (e) => {
         e.preventDefault();
         setLoading(true); setError(null);
         try {
            if (isSignUp) {
               const { error } = await supabase.auth.signUp({ email, password });
               if (error) throw error;
               alert('Check your email for the confirmation link.');
            } else {
               const { error } = await supabase.auth.signInWithPassword({ email, password });
               if (error) throw error;
            }
         } catch(err) {
            setError(err.message);
         } finally {
            setLoading(false);
         }
      }

      return (
         <div className="flex h-screen items-center justify-center bg-bgMain text-textMain p-4">
            <div className="bg-bgPanel border border-bgBorder rounded-md p-8 max-w-sm w-full shadow-2xl">
               <h1 className="text-2xl font-black uppercase tracking-[0.2em] text-center mb-1">MISHAV</h1>
               <p className="text-[10px] uppercase font-bold tracking-widest text-textDark text-center mb-8">Cloud Trading Journal</p>
               
               {error && <div className="bg-loss/10 border border-loss text-loss p-3 rounded text-xs font-bold uppercase tracking-wider text-center mb-6">{error}</div>}
               
               <form onSubmit={handleAuth} className="space-y-4">
                  <div>
                    <label className="block text-xs text-textMuted mb-1">Email Address</label>
                    <input type="email" required className="w-full bg-bgMain border border-bgBorder rounded p-3 text-sm text-textMain focus:border-accent outline-none" value={email} onChange={e=>setEmail(e.target.value)}/>
                  </div>
                  <div>
                    <label className="block text-xs text-textMuted mb-1">Password</label>
                    <input type="password" required className="w-full bg-bgMain border border-bgBorder rounded p-3 text-sm text-textMain focus:border-accent outline-none" value={password} onChange={e=>setPassword(e.target.value)}/>
                  </div>
                  
                  <button disabled={loading} type="submit" className="w-full bg-accent hover:bg-[#00cce6] text-[#080A0D] px-6 py-3 rounded text-sm font-bold transition-all shadow-[0_0_15px_rgba(0,229,255,0.2)] mt-4 disabled:opacity-50">
                     {loading ? 'Authenticating...' : (isSignUp ? 'Create Account' : 'Secure Login')}
                  </button>
               </form>
               
               <div className="mt-6 text-center">
                  <button onClick={() => setIsSignUp(!isSignUp)} className="text-xs text-textMuted hover:text-textMain transition-colors">
                     {isSignUp ? 'Already have an account? Sign In' : 'Need an account? Sign Up'}
                  </button>
               </div>
            </div>
         </div>
      );
    }

    const MigrationScreen = ({ onImport, onSkip }) => {
       return (
         <div className="fixed inset-0 bg-black/90 z-50 flex justify-center items-center p-4">
            <div className="bg-bgPanel border border-accent rounded-md p-8 max-w-lg w-full shadow-[0_0_30px_rgba(0,229,255,0.1)] text-center">
               <h2 className="text-xl font-bold uppercase tracking-wider text-textMain mb-4">Local Data Found</h2>
               <p className="text-sm text-textMuted mb-8">We found existing trading records saved locally on this browser. Would you like to securely import them into your new cloud account?</p>
               <div className="flex gap-4 justify-center">
                  <button onClick={onSkip} className="px-6 py-3 bg-bgMain border border-bgBorder hover:border-textDark rounded text-sm font-bold text-textMuted transition-colors w-full">Skip</button>
                  <button onClick={onImport} className="px-6 py-3 bg-accent hover:bg-[#00cce6] text-[#080A0D] rounded text-sm font-bold transition-all shadow-[0_0_15px_rgba(0,229,255,0.2)] w-full">Import Trades</button>
               </div>
               <p className="text-[10px] text-loss mt-4">Warning: Clicking Skip will start you with an empty cloud journal.</p>
            </div>
         </div>
       );
    }

    // ==========================================
    // 6. MAIN APP CONTAINER
    // ==========================================
    const MainJournal = ({ supabase, user }) => {
      const [view, setView] = useState('dashboard');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [syncStatus, setSyncStatus] = useState('Syncing...');
      const [showMigration, setShowMigration] = useState(false);
      const [isLoaded, setIsLoaded] = useState(false);
      
      const [trades, setTrades] = useState([]);
      const [goals, setGoals] = useState([]);
      const [startingBalance, setStartingBalance] = useState(50000);
      const [dashboardTarget, setDashboardTarget] = useState(8);
      const [dashboardTargetType, setDashboardTargetType] = useState('Percentage');
      const [sessionSettings, setSessionSettings] = useState({ configured: false, sessions: null });

      // Connection Status
      useEffect(() => {
         const handleOnline = () => setSyncStatus('Synced');
         const handleOffline = () => setSyncStatus('Offline');
         window.addEventListener('online', handleOnline);
         window.addEventListener('offline', handleOffline);
         return () => {
            window.removeEventListener('online', handleOnline);
            window.removeEventListener('offline', handleOffline);
         };
      }, []);

      // Initial DB Fetch & Realtime Subscription
      useEffect(() => {
         let isMounted = true;

         const loadData = async () => {
            try {
               setSyncStatus('Syncing...');
               const [resTrades, resGoals, resSettings] = await Promise.all([
                  supabase.from('trades').select('*'),
                  supabase.from('goals').select('*'),
                  supabase.from('settings').select('*').eq('user_id', user.id).single()
               ]);

               if(!isMounted) return;

               const cloudTrades = resTrades.data ? resTrades.data.map(t => t.data) : [];
               const cloudGoals = resGoals.data ? resGoals.data.map(g => g.data) : [];

               setTrades(cloudTrades);
               setGoals(cloudGoals);

               if (resSettings.data) {
                  setStartingBalance(resSettings.data.balance);
                  setDashboardTarget(resSettings.data.dashboard_target);
                  setDashboardTargetType(resSettings.data.dashboard_target_type);
                  setSessionSettings(resSettings.data.session_settings);
               }

               setSyncStatus('Synced');
               setIsLoaded(true);

               // Migration Check
               const localTradesStr = localStorage.getItem('mishav_trades');
               const localTrades = localTradesStr ? JSON.parse(localTradesStr) : [];
               if (localTrades.length > 0 && cloudTrades.length === 0) {
                  setShowMigration(true);
               }

            } catch(e) {
               console.error("Load Error:", e);
               setSyncStatus('Offline');
               setIsLoaded(true); // Load empty/offline
            }
         };

         loadData();

         // Setup Realtime
         const channel = supabase.channel('schema-db-changes')
           .on('postgres_changes', { event: '*', schema: 'public', table: 'trades' }, payload => {
               if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE') {
                  setTrades(prev => {
                     const exists = prev.find(t => t.id === payload.new.id);
                     if(exists) return prev.map(t => t.id === payload.new.id ? payload.new.data : t);
                     return [...prev, payload.new.data];
                  });
               } else if (payload.eventType === 'DELETE') {
                  setTrades(prev => prev.filter(t => t.id !== payload.old.id));
               }
           })
           .on('postgres_changes', { event: '*', schema: 'public', table: 'goals' }, payload => {
               if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE') {
                  setGoals(prev => {
                     const exists = prev.find(g => g.id === payload.new.id);
                     if(exists) return prev.map(g => g.id === payload.new.id ? payload.new.data : g);
                     return [...prev, payload.new.data];
                  });
               } else if (payload.eventType === 'DELETE') {
                  setGoals(prev => prev.filter(g => g.id !== payload.old.id));
               }
           })
           .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, payload => {
               if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE') {
                  if (payload.new.user_id === user.id) {
                     setStartingBalance(payload.new.balance);
                     setDashboardTarget(payload.new.dashboard_target);
                     setDashboardTargetType(payload.new.dashboard_target_type);
                     setSessionSettings(payload.new.session_settings);
                  }
               }
           })
           .subscribe();

         return () => {
            isMounted = false;
            supabase.removeChannel(channel);
         }
      }, [user.id, supabase]);

      const handleMigrationImport = async () => {
         setSyncStatus('Syncing...');
         setShowMigration(false);
         try {
            const localTradesStr = localStorage.getItem('mishav_trades');
            const localGoalsStr = localStorage.getItem('mishav_goals');
            const localTrades = localTradesStr ? JSON.parse(localTradesStr) : [];
            const localGoals = localGoalsStr ? JSON.parse(localGoalsStr) : [];

            const tradeInserts = localTrades.map(t => ({ id: t.id, user_id: user.id, data: t }));
            const goalInserts = localGoals.map(g => ({ id: g.id, user_id: user.id, data: g }));

            if (tradeInserts.length > 0) await supabase.from('trades').upsert(tradeInserts);
            if (goalInserts.length > 0) await supabase.from('goals').upsert(goalInserts);
            
            // Mark migrated
            localStorage.removeItem('mishav_trades'); 
            setSyncStatus('Synced');
         } catch(e) {
            console.error("Migration Error:", e);
            setSyncStatus('Offline');
         }
      };

      const handleMigrationSkip = () => {
         localStorage.removeItem('mishav_trades'); 
         setShowMigration(false);
      };

      // CRUD Wrappers
      const saveTrade = async (trade) => {
         // Optimistic
         setTrades(prev => {
            if(prev.find(t => t.id === trade.id)) return prev.map(t => t.id === trade.id ? trade : t);
            return [...prev, trade];
         });
         setSyncStatus('Syncing...');
         const { error } = await supabase.from('trades').upsert({ id: trade.id, user_id: user.id, data: trade });
         if (error) setSyncStatus('Offline'); else setSyncStatus('Synced');
      };

      const deleteTrade = async (id) => {
         setTrades(prev => prev.filter(t => t.id !== id));
         setSyncStatus('Syncing...');
         const { error } = await supabase.from('trades').delete().eq('id', id);
         if (error) setSyncStatus('Offline'); else setSyncStatus('Synced');
      };

      const saveGoal = async (goal) => {
         setGoals(prev => {
            if(prev.find(g => g.id === goal.id)) return prev.map(g => g.id === goal.id ? goal : g);
            return [...prev, goal];
         });
         setSyncStatus('Syncing...');
         const { error } = await supabase.from('goals').upsert({ id: goal.id, user_id: user.id, data: goal });
         if (error) setSyncStatus('Offline'); else setSyncStatus('Synced');
      };

      const deleteGoal = async (id) => {
         setGoals(prev => prev.filter(g => g.id !== id));
         setSyncStatus('Syncing...');
         const { error } = await supabase.from('goals').delete().eq('id', id);
         if (error) setSyncStatus('Offline'); else setSyncStatus('Synced');
      };

      const updateSettings = async (updates) => {
         // Optimistic
         if (updates.balance !== undefined) setStartingBalance(updates.balance);
         if (updates.dashboard_target !== undefined) setDashboardTarget(updates.dashboard_target);
         if (updates.dashboard_target_type !== undefined) setDashboardTargetType(updates.dashboard_target_type);
         if (updates.session_settings !== undefined) setSessionSettings(updates.session_settings);

         setSyncStatus('Syncing...');
         const { error } = await supabase.from('settings').upsert({ 
            user_id: user.id, 
            balance: updates.balance !== undefined ? updates.balance : startingBalance,
            dashboard_target: updates.dashboard_target !== undefined ? updates.dashboard_target : dashboardTarget,
            dashboard_target_type: updates.dashboard_target_type !== undefined ? updates.dashboard_target_type : dashboardTargetType,
            session_settings: updates.session_settings !== undefined ? updates.session_settings : sessionSettings
         });
         if (error) setSyncStatus('Offline'); else setSyncStatus('Synced');
      };

      // Debounced save for dashboard targets so we don't spam DB on typing
      useEffect(() => {
         if (!isLoaded) return;
         const timer = setTimeout(() => {
            updateSettings({ dashboard_target: dashboardTarget, dashboard_target_type: dashboardTargetType });
         }, 1500);
         return () => clearTimeout(timer);
      }, [dashboardTarget, dashboardTargetType]);

      const navItems = [
        { id: 'dashboard', label: 'Dashboard', icon: <Icons.Dashboard /> },
        { id: 'journal', label: 'Journal', icon: <Icons.Book /> },
        { id: 'trades', label: 'Trades', icon: <Icons.List /> },
        { id: 'analytics', label: 'Analytics', icon: <Icons.Activity /> },
        { id: 'calendar', label: 'Calendar', icon: <Icons.Calendar /> },
        { id: 'goals', label: 'Goals', icon: <Icons.Target /> },
        { id: 'settings', label: 'Settings', icon: <Icons.Settings /> },
      ];

      const renderView = () => {
        if (!isLoaded) return <div className="flex items-center justify-center h-full text-textMuted font-mono">LOADING CLOUD DATA...</div>;

        switch(view) {
          case 'dashboard': return <DashboardView trades={trades} startingBalance={startingBalance} dashboardTarget={dashboardTarget} setDashboardTarget={setDashboardTarget} dashboardTargetType={dashboardTargetType} setDashboardTargetType={setDashboardTargetType} />;
          case 'journal': return <JournalView trades={trades} />;
          case 'trades': return <TradesView trades={trades} saveTrade={saveTrade} deleteTrade={deleteTrade} sessionSettings={sessionSettings} />;
          case 'calendar': return <CalendarView trades={trades} />;
          case 'analytics': return <AnalyticsView trades={trades} sessionSettings={sessionSettings} updateSettings={updateSettings} />;
          case 'settings': return <SettingsView trades={trades} startingBalance={startingBalance} updateSettings={updateSettings} />;
          case 'goals': return <GoalsView trades={trades} startingBalance={startingBalance} goals={goals} saveGoal={saveGoal} deleteGoal={deleteGoal} />;
          default: return <DashboardView trades={trades} startingBalance={startingBalance} dashboardTarget={dashboardTarget} setDashboardTarget={setDashboardTarget} dashboardTargetType={dashboardTargetType} setDashboardTargetType={setDashboardTargetType} />;
        }
      };

      const handleNavClick = (id) => { setView(id); setMobileMenuOpen(false); };
      const handleLogout = async () => { await supabase.auth.signOut(); };

      const totalBalance = startingBalance + trades.reduce((s,t) => s + t.pnl, 0);

      // Edge Score calculation
      let wins = 0, losses = 0, grossWin = 0, grossLoss = 0;
      trades.forEach(t => {
        if (t.result === 'WIN') { wins++; grossWin += t.pnl; }
        if (t.result === 'LOSS') { losses++; grossLoss += Math.abs(t.pnl); }
      });
      const winRate = trades.length ? (wins / (wins + losses)) * 100 : 0;
      const pf = grossLoss > 0 ? (grossWin / grossLoss) : grossWin > 0 ? 99 : 0;
      const isPfGood = pf > 1;
      const globalEdgeScore = trades.length > 0 ? (winRate * 0.8 + (isPfGood ? 20 : 0)).toFixed(0) : 0;

      return (
        <div className="flex h-screen w-full overflow-hidden bg-bgMain text-textMain selection:bg-accent/30 selection:text-white font-sans relative">
          {showMigration && <MigrationScreen onImport={handleMigrationImport} onSkip={handleMigrationSkip} />}

          {/* Sidebar (Desktop) */}
          <aside className="w-64 bg-bgPanel border-r border-bgBorder flex-col justify-between hidden md:flex shrink-0 z-20">
            <div>
              <div className="p-6">
                <h1 className="text-textMain font-black text-xl uppercase tracking-[0.2em]">MISHAV</h1>
                <p className="text-textDark text-[10px] uppercase font-bold tracking-widest mt-1">Trading Journal</p>
              </div>
              <nav className="mt-2 flex flex-col gap-1 px-3">
                {navItems.map(item => (
                  <button key={item.id} onClick={() => handleNavClick(item.id)} className={`flex items-center gap-3 w-full px-4 py-2.5 rounded-md text-sm font-medium transition-all ${view === item.id ? 'bg-bgBorder text-accent' : 'text-textMuted hover:bg-bgMain hover:text-textMain'}`}>
                    {item.icon} {item.label}
                  </button>
                ))}
              </nav>
            </div>
            <div className="p-4 border-t border-bgBorder space-y-2">
              <div className="px-4 py-2 bg-bgMain border border-bgBorder rounded text-center">
                <span className="text-[10px] text-textMuted uppercase block">Edge Score</span>
                <span className="text-accent font-bold font-mono">{globalEdgeScore} / 100</span>
              </div>
            </div>
          </aside>

          {/* Sidebar (Mobile Overlay) */}
          {mobileMenuOpen && (
             <div className="fixed inset-0 bg-black/80 z-40 md:hidden flex" onClick={() => setMobileMenuOpen(false)}>
                <aside className="w-64 bg-bgPanel border-r border-bgBorder flex flex-col justify-between shrink-0 h-full shadow-2xl" onClick={e => e.stopPropagation()}>
                  <div>
                    <div className="p-6 flex justify-between items-center">
                      <div>
                        <h1 className="text-textMain font-black text-xl uppercase tracking-[0.2em]">MISHAV</h1>
                        <p className="text-textDark text-[10px] uppercase font-bold tracking-widest mt-1">Trading Journal</p>
                      </div>
                      <button onClick={() => setMobileMenuOpen(false)} className="text-textMuted hover:text-textMain p-2">✕</button>
                    </div>
                    <nav className="mt-2 flex flex-col gap-1 px-3">
                      {navItems.map(item => (
                        <button key={item.id} onClick={() => handleNavClick(item.id)} className={`flex items-center gap-3 w-full px-4 py-3 rounded-md text-sm font-medium transition-all ${view === item.id ? 'bg-bgBorder text-accent' : 'text-textMuted hover:bg-bgMain hover:text-textMain'}`}>
                          {item.icon} {item.label}
                        </button>
                      ))}
                    </nav>
                  </div>
                </aside>
             </div>
          )}

          <div className="flex-1 flex flex-col min-w-0 h-full overflow-hidden relative">
            <header className="h-16 flex items-center justify-between px-4 md:px-6 bg-bgMain/80 backdrop-blur-sm border-b border-bgBorder sticky top-0 z-10 shrink-0">
              <div className="flex items-center gap-3 md:gap-4">
                <button className="md:hidden text-textMuted hover:text-textMain p-2 -ml-2" onClick={() => setMobileMenuOpen(true)}>
                  <Icons.List />
                </button>
                <div>
                  <h2 className="text-textMain font-semibold uppercase tracking-wider text-sm">{navItems.find(n=>n.id===view)?.label || 'Dashboard'}</h2>
                </div>
              </div>
              <div className="text-right flex items-center gap-4">
                <div className="hidden sm:flex flex-col items-end pr-4 border-r border-bgBorder">
                   <div className="text-[10px] text-textMuted flex items-center gap-1">
                     <span className={`w-1.5 h-1.5 rounded-full ${syncStatus === 'Synced' ? 'bg-profit' : syncStatus === 'Syncing...' ? 'bg-accent' : 'bg-loss'}`}></span>
                     {syncStatus}
                   </div>
                   <div className="text-[10px] font-mono mt-0.5 text-textMain">{user.email}</div>
                   <button onClick={handleLogout} className="text-[9px] uppercase text-loss hover:underline mt-0.5">Logout</button>
                </div>
                <div>
                  <p className="text-textDark text-[9px] md:text-[10px] uppercase font-bold tracking-widest">Account Balance</p>
                  <p className="text-textMain font-mono font-bold text-sm md:text-base">{formatMoney(totalBalance)}</p>
                </div>
              </div>
            </header>

            <main className="flex-1 overflow-y-auto p-4 md:p-6 scroll-smooth">
              <div className="max-w-7xl mx-auto h-full">
                {renderView()}
              </div>
            </main>
          </div>
        </div>
      );
    };

    // ==========================================
    // 7. APP BOOTSTRAPPER (AUTH / SETUP)
    // ==========================================
    const Bootstrapper = () => {
      const [supabaseConfig, setSupabaseConfig] = useState(() => {
         const url = localStorage.getItem('mishav_supabase_url');
         const key = localStorage.getItem('mishav_supabase_key');
         return (url && key) ? { url, key } : null;
      });

      const [supabaseClient, setSupabaseClient] = useState(null);
      const [user, setUser] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(true);

      useEffect(() => {
         if (supabaseConfig) {
            const client = window.supabase.createClient(supabaseConfig.url, supabaseConfig.key);
            setSupabaseClient(client);
            
            client.auth.getSession().then(({ data: { session } }) => {
               setUser(session?.user || null);
               setLoadingAuth(false);
            });

            const { data: { subscription } } = client.auth.onAuthStateChange((_event, session) => {
               setUser(session?.user || null);
            });
            return () => subscription.unsubscribe();
         }
      }, [supabaseConfig]);

      if (!supabaseConfig) {
         return <SetupScreen onComplete={() => {
            setSupabaseConfig({
               url: localStorage.getItem('mishav_supabase_url'),
               key: localStorage.getItem('mishav_supabase_key')
            });
         }} />;
      }

      if (loadingAuth) return <div className="flex h-screen items-center justify-center bg-bgMain text-textMuted font-mono text-sm">AUTHENTICATING...</div>;
      
      if (!user) return <AuthScreen supabase={supabaseClient} />;

      return <MainJournal supabase={supabaseClient} user={user} />;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Bootstrapper />);
  </script>
</body>
</html>
