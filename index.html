<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mishav Trading Journal</title>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bgMain: '#080A0D',
            bgPanel: '#0D1117',
            bgBorder: '#11161D',
            textMain: '#F5F7FA',
            textMuted: '#A7AFBA',
            textDark: '#6F7885',
            profit: '#00FFB2',
            loss: '#FF4D67',
            accent: '#00E5FF'
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #080A0D; color: #F5F7FA; margin: 0; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #080A0D; }
    ::-webkit-scrollbar-thumb { background: #11161D; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #6F7885; }
    /* Checkbox custom styles */
    input[type="checkbox"] {
      appearance: none; background-color: transparent; margin: 0; font: inherit; color: currentColor;
      width: 1.15em; height: 1.15em; border: 1px solid #11161D; border-radius: 0.15em; display: grid; place-content: center;
    }
    input[type="checkbox"]::before {
      content: ""; width: 0.65em; height: 0.65em; transform: scale(0); transition: 120ms transform ease-in-out;
      box-shadow: inset 1em 1em var(--checkbox-color, #00E5FF); background-color: var(--checkbox-color, #00E5FF);
      transform-origin: center; clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
    }
    input[type="checkbox"]:checked::before { transform: scale(1); }
    input[type="checkbox"]:focus { outline: max(2px, 0.15em) solid #11161D; outline-offset: max(2px, 0.15em); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ==========================================
    // 1. CONSTANTS & UTILS
    // ==========================================
    const MISTAKE_OPTS = ['FOMO', 'Revenge Trading', 'Overtrading', 'Early Entry', 'Late Entry', 'Moved SL', 'Moved TP', 'Oversized Risk', 'No Confirmation', 'Ignored Trading Plan', 'Chased Price', 'Emotional Entry'];
    const PAIR_OPTS = ['XAUUSD', 'EURUSD', 'GBPUSD', 'USDJPY', 'US30', 'NAS100'];
    const GOAL_TYPES = ['Custom', 'Percentage', 'Trades', 'Account Balance', 'Net P&L', 'Monthly P&L', 'Win Rate', 'Profit Factor', 'Maximum Drawdown', 'Number of Trades', 'R Multiple', 'Rule Adherence'];

    const CHECKLIST_RULES = [
      { key: 'sessionTiming', title: 'Trading within the defined session timing.' },
      { key: 'physicallyPresent', title: 'Physically present for the setup.' },
      { key: 'entryModel', title: 'Trading according to the defined entry model.' },
      { key: 'validZone', title: 'Trading inside a valid trading zone.', sub: 'Valid zones:\nQML\nISS WAVE 4\nTJL 2' },
      { key: 'confirmation', title: 'Confirmation received.', sub: 'Valid confirmations:\nCHoCH\nRetest Sweep\nBullish Engulfing Candle\nBearish Engulfing Candle' }
    ];

    const formatMoney = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val);
    const formatDate = (dateStr) => new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

    const toMinutes = (timeObj) => {
      let h = parseInt(timeObj.h, 10);
      if (timeObj.a === 'PM' && h !== 12) h += 12;
      if (timeObj.a === 'AM' && h === 12) h = 0;
      return h * 60 + parseInt(timeObj.m, 10);
    };

    const format12Hour = (timeObj) => `${timeObj.h}:${timeObj.m} ${timeObj.a}`;
    
    const format12To24 = (timeObj) => {
      let h = parseInt(timeObj.h, 10);
      if (timeObj.a === 'PM' && h !== 12) h += 12;
      if (timeObj.a === 'AM' && h === 12) h = 0;
      return `${h.toString().padStart(2, '0')}:${timeObj.m}`;
    };

    const parse24To12 = (timeStr) => {
      if (!timeStr) return { h: '12', m: '00', a: 'PM' };
      const [hStr, mStr] = timeStr.split(':');
      let h = parseInt(hStr, 10);
      let a = 'AM';
      if (h >= 12) { a = 'PM'; if (h > 12) h -= 12; }
      if (h === 0) h = 12;
      return { h: h.toString(), m: mStr, a };
    };

    const checkOverlap = (sessions) => {
      let intervals = [];
      for (const s of sessions) {
         if (s.start === s.end) return true;
         if (s.start < s.end) intervals.push({start: s.start, end: s.end});
         else { intervals.push({start: s.start, end: 1440}); intervals.push({start: 0, end: s.end}); }
      }
      for (let i = 0; i < intervals.length; i++) {
        for (let j = i + 1; j < intervals.length; j++) {
          const a = intervals[i], b = intervals[j];
          if (Math.max(a.start, b.start) < Math.min(a.end, b.end)) return true;
        }
      }
      return false;
    };

    // ==========================================
    // 2. ICONS
    // ==========================================
    const Icons = {
      Dashboard: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>,
      Book: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>,
      List: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>,
      Activity: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
      Calendar: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
      Target: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>,
      Settings: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
      Plus: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
      Trash: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    };

    // ==========================================
    // 3. CORE COMPONENTS
    // ==========================================
    const TimePicker = ({ label, value, onChange, isCompact = false }) => (
      <div>
        <label className={`block text-textMuted mb-1 ${isCompact ? 'text-[10px] uppercase tracking-widest' : 'text-xs'}`}>{label}</label>
        <div className="flex gap-2">
          <div className="relative flex-1">
             <select className="w-full bg-bgMain border border-bgBorder rounded p-2 text-sm text-textMain focus:border-accent outline-none appearance-none font-mono" value={value.h} onChange={e=>onChange({...value, h:e.target.value})}>
               {[...Array(12)].map((_, i) => <option key={i+1} value={i+1}>{i+1}</option>)}
             </select>
             <div className="absolute inset-y-0 right-2 flex items-center pointer-events-none text-textMuted text-[10px]">▼</div>
          </div>
          <div className="relative flex-1">
             <select className="w-full bg-bgMain border border-bgBorder rounded p-2 text-sm text-textMain focus:border-accent outline-none appearance-none font-mono" value={value.m} onChange={e=>onChange({...value, m:e.target.value})}>
               {['00','05','10','15','20','25','30','35','40','45','50','55'].map(m => <option key={m} value={m}>{m}</option>)}
             </select>
             <div className="absolute inset-y-0 right-2 flex items-center pointer-events-none text-textMuted text-[10px]">▼</div>
          </div>
          <div className="relative flex-1">
             <select className="w-full bg-bgMain border border-bgBorder rounded p-2 text-sm text-textMain focus:border-accent outline-none appearance-none font-mono" value={value.a} onChange={e=>onChange({...value, a:e.target.value})}>
               <option value="AM">AM</option><option value="PM">PM</option>
             </select>
             <div className="absolute inset-y-0 right-2 flex items-center pointer-events-none text-textMuted text-[10px]">▼</div>
          </div>
        </div>
      </div>
    );

    const StatCard = ({ label, value, subtext, type = 'neutral' }) => {
      const colorClass = type === 'profit' ? 'text-profit' : type === 'loss' ? 'text-loss' : type === 'accent' ? 'text-accent' : 'text-textMain';
      return (
        <div className="bg-bgPanel border border-bgBorder rounded-md p-4 shadow-sm flex flex-col">
          <span className="text-textMuted text-xs font-medium uppercase tracking-wider mb-1">{label}</span>
          <span className={`text-2xl font-mono font-bold ${colorClass}`}>{value}</span>
          {subtext && <span className="text-textDark text-xs mt-1">{subtext}</span>}
        </div>
      );
    };

    const CumulativeChart = ({ data }) => {
      if (!data || data.length === 0) return <div className="h-full flex items-center justify-center text-textDark text-sm">No data available</div>;
      
      const width = 800; const height = 250;
      const padding = { top: 20, bottom: 20, left: 10, right: 10 };
      
      const maxPnL = Math.max(...data.map(d => d.cumulativePnl), 0) * 1.1 || 100;
      const minPnL = Math.min(...data.map(d => d.cumulativePnl), 0) * 1.1 || -100;
      const rangeY = maxPnL - minPnL;
      
      const getX = (index) => padding.left + (index / Math.max(data.length - 1, 1)) * (width - padding.left - padding.right);
      const getY = (val) => height - padding.bottom - ((val - minPnL) / rangeY) * (height - padding.top - padding.bottom);
      const zeroY = getY(0);

      const pathData = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(d.cumulativePnl)}`).join(' ');
      const areaPath = `${pathData} L ${getX(data.length - 1)} ${zeroY} L ${getX(0)} ${zeroY} Z`;

      const isOverallProfit = data[data.length-1].cumulativePnl >= 0;
      const strokeColor = isOverallProfit ? '#00FFB2' : '#FF4D67';
      const fillId = isOverallProfit ? 'profitFill' : 'lossFill';

      return (
        <div className="w-full h-full relative group">
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-full preserve-3d" preserveAspectRatio="none">
            <defs>
              <linearGradient id="profitFill" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0%" stopColor="#00FFB2" stopOpacity="0.15" />
                <stop offset="100%" stopColor="#00FFB2" stopOpacity="0" />
              </linearGradient>
              <linearGradient id="lossFill" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0%" stopColor="#FF4D67" stopOpacity="0.15" />
                <stop offset="100%" stopColor="#FF4D67" stopOpacity="0" />
              </linearGradient>
            </defs>
            <line x1={0} y1={zeroY} x2={width} y2={zeroY} stroke="#11161D" strokeWidth="1" strokeDasharray="4,4" />
            <path d={areaPath} fill={`url(#${fillId})`} />
            <path d={pathData} fill="none" stroke={strokeColor} strokeWidth="2" vectorEffect="non-scaling-stroke" />
            {data.map((d, i) => (
              <circle key={i} cx={getX(i)} cy={getY(d.cumulativePnl)} r="3" fill="#0D1117" stroke={strokeColor} strokeWidth="1.5" className="opacity-0 group-hover:opacity-100 transition-opacity" />
            ))}
          </svg>
          <div className="flex justify-between mt-2 px-2 text-[10px] text-textDark font-mono uppercase">
            <span>{formatDate(data[0].date)}</span>
            <span>{formatDate(data[Math.floor(data.length/2)].date)}</span>
            <span>{formatDate(data[data.length-1].date)}</span>
          </div>
        </div>
      );
    };

    // ==========================================
    // 4. MAIN VIEWS
    // ==========================================
    
    // --- DASHBOARD ---
    const DashboardView = ({ trades, startingBalance, dashboardTarget, setDashboardTarget, dashboardTargetType, setDashboardTargetType }) => {
      const stats = useMemo(() => {
        let net = 0, wins = 0, losses = 0, grossWin = 0, grossLoss = 0, maxDd = 0, peak = 0;
        trades.forEach(t => {
          net += t.pnl;
          if (net > peak) peak = net;
          if (peak - net > maxDd) maxDd = peak - net;
          if (t.result === 'WIN') { wins++; grossWin += t.pnl; }
          if (t.result === 'LOSS') { losses++; grossLoss += Math.abs(t.pnl); }
        });
        const winRate = trades.length ? ((wins / (wins + losses)) * 100).toFixed(1) : 0;
        const pf = grossLoss > 0 ? (grossWin / grossLoss).toFixed(2) : grossWin > 0 ? '∞' : '0.00';
        const exp = trades.length ? (net / trades.length).toFixed(2) : 0;
        return { net, winRate, wins, losses, pf, maxDd, exp, count: trades.length };
      }, [trades]);

      const cumulativeData = useMemo(() => {
        const sorted = [...trades].sort((a,b) => new Date(a.date) - new Date(b.date));
        const daily = {};
        sorted.forEach(t => { daily[t.date] = (daily[t.date] || 0) + t.pnl; });
        let cum = 0;
        return Object.entries(daily).map(([date, pnl]) => {
          cum += pnl;
          return { date, dailyPnl: pnl, cumulativePnl: cum };
        });
      }, [trades]);

      const netPct = startingBalance > 0 ? ((stats.net / startingBalance) * 100) : 0;
      const maxDdPct = startingBalance > 0 ? ((stats.maxDd / startingBalance) * 100).toFixed(2) : '0.00';
      
      const isPfGood = stats.pf === '∞' || parseFloat(stats.pf) > 1;
      const edgeScore = (parseFloat(stats.winRate) * 0.8 + (isPfGood ? 20 : 0)).toFixed(0);

      const targetVal = parseFloat(dashboardTarget) || 0;
      let rawProgress = 0;
      if (targetVal !== 0) {
        rawProgress = dashboardTargetType === 'Percentage' 
          ? (netPct / targetVal) * 100 
          : (stats.net / targetVal) * 100;
      }
      
      const isPositive = stats.net >= 0;
      const progressColor = isPositive ? '#00FFB2' : '#FF4D67';
      const progressClass = isPositive ? 'text-profit' : 'text-loss';
      const circleProgress = Math.min(Math.abs(rawProgress), 100);

      const radius = 64;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (circleProgress / 100) * circumference;

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
            <StatCard label="Net P&L" value={formatMoney(stats.net)} type={stats.net >= 0 ? 'profit' : 'loss'} subtext={`${stats.net >= 0 ? '+' : ''}${netPct.toFixed(2)}% Return`} />
            <StatCard label="Win Rate" value={`${stats.winRate}%`} subtext={`${stats.wins}W / ${stats.losses}L`} />
            <StatCard label="Profit Factor" value={stats.pf} type="accent" />
            <StatCard label="Total Trades" value={stats.count} />
            <StatCard label="Expectancy" value={formatMoney(stats.exp)} type={stats.exp >= 0 ? 'profit' : 'loss'} subtext="Per trade" />
            <StatCard label="Max Drawdown" value={formatMoney(-stats.maxDd)} type="loss" subtext={`-${maxDdPct}% of Balance`} />
          </div>

          <div className="bg-bgPanel border border-bgBorder rounded-md p-6 flex flex-col md:flex-row items-center justify-between gap-8 shadow-sm">
            <div className="flex flex-col md:flex-row items-center gap-8 flex-1 w-full">
              <div className="relative w-36 h-36 shrink-0 flex items-center justify-center">
                <svg className="w-full h-full transform -rotate-90">
                  <circle cx="72" cy="72" r="64" stroke="#11161D" strokeWidth="8" fill="none" />
                  <circle cx="72" cy="72" r="64" stroke={progressColor} strokeWidth="8" fill="none" strokeDasharray={circumference} strokeDashoffset={offset} className="transition-all duration-500" strokeLinecap="round" />
                </svg>
                <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
                  <span className={`text-2xl font-bold font-mono ${progressClass}`}>{netPct > 0 ? '+' : ''}{netPct.toFixed(2)}%</span>
                  <span className={`text-[10px] font-bold uppercase mt-1 ${progressClass}`}>{Math.abs(rawProgress).toFixed(0)}% OF TARGET</span>
                </div>
              </div>

              <div className="text-center md:text-left flex flex-col justify-center w-full">
                <h3 className="text-base font-bold text-textMain uppercase tracking-wider mb-4">Account Progress</h3>
                <div className="space-y-2.5 text-sm">
                  <div className="flex items-center">
                    <span className="text-textMuted w-32 text-left">Current Return:</span> 
                    <span className={`font-mono font-bold ${progressClass}`}>
                      {dashboardTargetType === 'Percentage' ? `${netPct > 0 ? '+' : ''}${netPct.toFixed(2)}%` : `${stats.net > 0 ? '+' : ''}${formatMoney(stats.net)}`}
                    </span>
                  </div>
                  <div className="flex items-center">
                    <span className="text-textMuted w-32 text-left">Target:</span> 
                    <span className="font-mono font-bold text-textMain">
                      {dashboardTargetType === 'Percentage' ? `+${targetVal}%` : `+${formatMoney(targetVal)}`}
                    </span>
                  </div>
                  <div className="flex items-center">
                    <span className="text-textMuted w-32 text-left">Target Type:</span> 
                    <span className="text-textMain">{dashboardTargetType}</span>
                  </div>
                </div>
              </div>
            </div>

            <div className="shrink-0 w-full md:w-64 space-y-4">
              <div>
                <label className="block text-sm text-textMuted mb-2">Target Type</label>
                <div className="relative">
                  <select className="w-full bg-bgMain border border-bgBorder rounded-md p-2.5 text-sm text-textMain focus:border-accent outline-none appearance-none" value={dashboardTargetType} onChange={e => setDashboardTargetType(e.target.value)}>
                    <option value="Percentage">Percentage</option>
                    <option value="USD">USD</option>
                  </select>
                  <div className="absolute inset-y-0 right-3 flex items-center pointer-events-none text-textMain">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="6 9 12 15 18 9"/></svg>
                  </div>
                </div>
              </div>
              <div>
                <label className="block text-sm text-textMuted mb-2">Target</label>
                <input type="number" step="any" className="w-full bg-bgMain border border-bgBorder rounded-md p-2.5 text-sm text-textMain focus:border-accent outline-none font-mono" value={dashboardTarget} onChange={e => setDashboardTarget(e.target.value)} />
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <div className="lg:col-span-2 bg-bgPanel border border-bgBorder rounded-md p-5 flex flex-col h-[350px]">
              <div className="mb-4">
                <h3 className="text-textMain text-sm font-medium uppercase tracking-wider">Daily Cumulative P&L</h3>
                <p className="text-textDark text-xs mt-1">Running total over time</p>
              </div>
              <div className="flex-1 min-h-0 border-t border-b border-bgBorder relative pt-4">
                <CumulativeChart data={cumulativeData} />
              </div>
            </div>
            
            <div className="bg-bgPanel border border-bgBorder rounded-md p-5 flex flex-col h-[350px]">
              <h3 className="text-textMain text-sm font-medium uppercase tracking-wider mb-4">Edge Score</h3>
              <div className="flex-1 flex flex-col justify-center items-center gap-6">
                <div className="relative w-32 h-32 rounded-full border-4 border-bgBorder flex items-center justify-center">
                  <div className="absolute inset-2 rounded-full border-4 border-accent opacity-20 border-t-accent opacity-100 animate-[spin_3s_linear_infinite]"></div>
                  <span className="text-3xl font-bold font-mono text-textMain">{isNaN(edgeScore) ? '0' : edgeScore}</span>
                </div>
                <div className="w-full text-xs text-textMuted space-y-2">
                  <div className="flex justify-between"><span>Consistency</span><span className="text-profit">High</span></div>
                  <div className="flex justify-between"><span>Risk Mgmt</span><span className="text-accent">Stable</span></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- JOURNAL ---
    const JournalView = ({ trades }) => {
      const sorted = [...trades].sort((a,b) => new Date(b.date) - new Date(a.date));
      
      return (
        <div className="space-y-4">
          <h2 className="text-lg font-semibold uppercase tracking-wider text-textMain mb-4">Trading Journal</h2>
          
          {sorted.length === 0 && (
            <div className="text-center p-12 bg-bgPanel border border-bgBorder rounded-md text-textMuted">
              No journal entries yet. Add a trade to get started.
            </div>
          )}

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {sorted.map(t => {
              const cl = t.checklist || { sessionTiming: false, physicallyPresent: false, entryModel: false, validZone: false, confirmation: false };
              const followedCount = Object.values(cl).filter(Boolean).length;
              const compliancePct = (followedCount / 5) * 100;
              
              const barColor = followedCount === 5 ? 'bg-profit' : followedCount === 0 ? 'bg-loss' : 'bg-accent';
              const textColor = followedCount === 5 ? 'text-profit' : followedCount === 0 ? 'text-loss' : 'text-accent';

              const time12Obj = parse24To12(t.time || '12:00');

              return (
                <div key={t.id} className={`bg-bgPanel border-l-4 border-y border-r border-y-bgBorder border-r-bgBorder rounded-r-md p-5 shadow-sm ${t.pnl >= 0 ? 'border-l-profit' : 'border-l-loss'} flex flex-col`}>
                  <div className="flex justify-between items-start mb-3">
                    <div>
                      <div className="flex gap-2 items-center">
                        <span className="font-bold text-lg">{t.pair}</span>
                        <span className={`text-xs px-2 py-0.5 rounded bg-bgMain border border-bgBorder font-bold ${t.direction==='LONG' || t.direction==='BUY' ? 'text-profit' : 'text-loss'}`}>{t.direction==='LONG' || t.direction==='BUY' ? '↑ BUY' : '↓ SELL'}</span>
                      </div>
                      <span className="text-xs text-textMuted font-mono">{formatDate(t.date)} • {format12Hour(time12Obj)} • {t.session}</span>
                    </div>
                    <div className="text-right">
                      <div className={`font-mono text-xl font-bold ${t.pnl > 0 ? 'text-profit' : t.pnl < 0 ? 'text-loss' : 'text-textMain'}`}>{t.pnl > 0 ? '+' : ''}{formatMoney(t.pnl)}</div>
                      <div className="text-xs text-textDark font-mono mt-1">
                        {t.entry ? `Entry: ${t.entry}` : ''}
                        {t.exit ? ` | Exit: ${t.exit}` : ''}
                      </div>
                    </div>
                  </div>
                  
                  <div className="space-y-3 mt-4 text-sm text-textMuted flex-1">
                    <div><strong className="text-textMain font-medium">Notes:</strong> {t.notes || 'No notes.'}</div>
                    {t.mistakes?.length > 0 && (
                      <div className="pt-2 flex flex-wrap gap-1.5">
                        {t.mistakes.map(m => <span key={m} className="text-[10px] uppercase bg-[#2A1519] text-loss px-2 py-1 rounded border border-[#3A1C22]">{m}</span>)}
                      </div>
                    )}
                  </div>

                  <div className="mt-5 pt-4 border-t border-bgBorder">
                    <div className="flex justify-between items-center mb-3">
                      <h4 className="text-xs font-bold text-textMain uppercase tracking-wider">Pre-Trade Checklist</h4>
                      <div className="text-right">
                        <span className={`text-sm font-bold font-mono ${textColor}`}>{followedCount}/5 ({compliancePct}%)</span>
                      </div>
                    </div>
                    
                    <div className="space-y-2 mb-4 bg-bgMain p-3 rounded border border-bgBorder">
                      {CHECKLIST_RULES.map(rule => (
                        <div key={rule.key} className="flex items-start gap-2 text-xs">
                          <span className={cl[rule.key] ? 'text-profit font-bold' : 'text-loss opacity-80'}>
                            {cl[rule.key] ? '☑' : '☒'}
                          </span>
                          <span className={cl[rule.key] ? 'text-textMuted' : 'text-textDark opacity-80 line-through'}>
                            {rule.title}
                          </span>
                        </div>
                      ))}
                    </div>

                    {t.justification && (
                      <div className="bg-[#11161D] p-3 rounded border border-bgBorder text-sm text-textMuted whitespace-pre-line">
                        <strong className="text-accent text-[10px] uppercase tracking-widest block mb-1">Trade Justification:</strong>
                        {t.justification}
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    // --- TRADES & FORM ---
    const TradesView = ({ trades, saveTrade, deleteTrade, sessionSettings }) => {
      const [showModal, setShowModal] = useState(false);
      const [editingId, setEditingId] = useState(null);
      
      const defaultForm = { 
        date: new Date().toISOString().split('T')[0], 
        pair: 'XAUUSD', direction: 'BUY', session: 'New York', 
        pnl: 0, entry: '', exit: '', sl: '', tp: '', lotSize: '', mistakes: [], notes: '',
        checklist: { sessionTiming: false, physicallyPresent: false, entryModel: false, validZone: false, confirmation: false },
        justification: ''
      };
      
      const [form, setForm] = useState(defaultForm);
      const [time12, setTime12] = useState({ h: '12', m: '00', a: 'PM' });

      // Automatically determine session based on custom configured timings
      useEffect(() => {
        const t24 = format12To24(time12);
        if (sessionSettings?.configured) {
          const [th, tm] = t24.split(':');
          const tMin = parseInt(th, 10) * 60 + parseInt(tm, 10);
          
          const rAsia = { start: toMinutes(sessionSettings.sessions.Asia.start), end: toMinutes(sessionSettings.sessions.Asia.end), name: 'Asia' };
          const rLondon = { start: toMinutes(sessionSettings.sessions.London.start), end: toMinutes(sessionSettings.sessions.London.end), name: 'London' };
          const rNY = { start: toMinutes(sessionSettings.sessions.NewYork.start), end: toMinutes(sessionSettings.sessions.NewYork.end), name: 'New York' };

          let matchedSession = 'New York'; // default fallback
          for (const r of [rAsia, rLondon, rNY]) {
            if (r.start < r.end) {
               if (tMin >= r.start && tMin < r.end) matchedSession = r.name;
            } else {
               if (tMin >= r.start || tMin < r.end) matchedSession = r.name;
            }
          }
          setForm(prev => ({...prev, session: matchedSession}));
        }
      }, [time12, sessionSettings]);

      const handleSave = (e) => {
        e.preventDefault();
        const pnlNum = parseFloat(form.pnl) || 0;
        
        const followedCount = Object.values(form.checklist).filter(Boolean).length;
        
        const newTrade = { 
          ...form, 
          id: editingId || crypto.randomUUID(), 
          time: format12To24(time12), // Safely store as 24-hour internally
          pnl: pnlNum, 
          entry: form.entry ? parseFloat(form.entry) : '',
          exit: form.exit ? parseFloat(form.exit) : '',
          sl: form.sl ? parseFloat(form.sl) : '',
          tp: form.tp ? parseFloat(form.tp) : '',
          lotSize: form.lotSize ? parseFloat(form.lotSize) : '',
          result: pnlNum > 0 ? 'WIN' : pnlNum < 0 ? 'LOSS' : 'BREAKEVEN',
          rulesFollowed: followedCount,
          rulesTotal: 5,
          ruleCompliancePercent: (followedCount / 5) * 100
        };

        saveTrade(newTrade);
        setShowModal(false); 
        setForm(defaultForm); 
        setEditingId(null);
      };

      const handleDelete = (id) => { if(confirm('Delete trade?')) deleteTrade(id); };
      
      const handleEdit = (t) => { 
        let initDir = t.direction || 'BUY';
        if(initDir === 'LONG') initDir = 'BUY';
        if(initDir === 'SHORT') initDir = 'SELL';

        setTime12(parse24To12(t.time || '12:00'));

        setForm({
          ...defaultForm, 
          ...t,
          direction: initDir,
          checklist: t.checklist || { sessionTiming: false, physicallyPresent: false, entryModel: false, validZone: false, confirmation: false },
          justification: t.justification || ''
        }); 
        setEditingId(t.id); 
        setShowModal(true); 
      };
      
      const toggleMistake = (m) => {
        setForm(prev => ({ ...prev, mistakes: prev.mistakes.includes(m) ? prev.mistakes.filter(x => x !== m) : [...prev.mistakes, m] }));
      };

      const followedCount = Object.values(form.checklist).filter(Boolean).length;
      const compliancePct = (followedCount / 5) * 100;
      const barColor = followedCount === 5 ? 'bg-profit' : followedCount === 0 ? 'bg-loss' : 'bg-accent';
      const textColor = followedCount === 5 ? 'text-profit' : followedCount === 0 ? 'text-loss' : 'text-accent';

      return (
        <div className="space-y-4 h-full flex flex-col">
          <div className="flex justify-between items-center">
            <h2 className="text-lg font-semibold uppercase tracking-wider text-textMain">All Trades</h2>
            <button onClick={() => { setForm(defaultForm); setTime12({h:'12', m:'00', a:'PM'}); setEditingId(null); setShowModal(true); }} className="bg-accent hover:bg-[#00cce6] text-[#080A0D] px-4 py-2 rounded text-sm font-bold flex items-center gap-2 transition-colors">
              <Icons.Plus /> Add Trade
            </button>
          </div>

          <div className="flex-1 bg-bgPanel border border-bgBorder rounded-md overflow-hidden flex flex-col">
            <div className="overflow-x-auto flex-1">
              <table className="w-full text-left text-sm whitespace-nowrap">
                <thead className="bg-[#11161D] text-textMuted text-xs uppercase font-medium sticky top-0">
                  <tr>
                    <th className="px-4 py-3">Date</th>
                    <th className="px-4 py-3">Pair</th>
                    <th className="px-4 py-3">Direction</th>
                    <th className="px-4 py-3 text-right">Entry</th>
                    <th className="px-4 py-3 text-right">Exit</th>
                    <th className="px-4 py-3 text-right">Lot Size</th>
                    <th className="px-4 py-3 text-center">Rules Followed</th>
                    <th className="px-4 py-3 text-right">P/L</th>
                    <th className="px-4 py-3 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-bgBorder text-textMain">
                  {trades.length === 0 && (
                     <tr><td colSpan="9" className="px-4 py-6 text-center text-textMuted">No trades found.</td></tr>
                  )}
                  {[...trades].sort((a,b) => new Date(b.date) - new Date(a.date)).map(t => {
                    const isBuy = t.direction === 'LONG' || t.direction === 'BUY';
                    const dirLabel = isBuy ? '↑ BUY' : '↓ SELL';
                    const dirColor = isBuy ? 'text-profit' : 'text-loss';
                    
                    const ruleCount = t.rulesFollowed !== undefined ? t.rulesFollowed : (t.checklist ? Object.values(t.checklist).filter(Boolean).length : 0);
                    const rulePct = t.ruleCompliancePercent !== undefined ? t.ruleCompliancePercent : ((ruleCount / 5) * 100);
                    const ruleColor = ruleCount === 5 ? 'text-profit' : 'text-accent';

                    return (
                      <tr key={t.id} className="hover:bg-bgBorder transition-colors">
                        <td className="px-4 py-3 font-mono text-textMuted">{formatDate(t.date)}</td>
                        <td className="px-4 py-3 font-medium">{t.pair}</td>
                        <td className={`px-4 py-3 text-xs font-bold ${dirColor}`}>{dirLabel}</td>
                        <td className="px-4 py-3 text-right font-mono">{t.entry || '-'}</td>
                        <td className="px-4 py-3 text-right font-mono">{t.exit || '-'}</td>
                        <td className="px-4 py-3 text-right font-mono text-accent">{t.lotSize || '-'}</td>
                        <td className="px-4 py-3 text-center">
                          <div className={`font-mono font-bold ${ruleColor}`}>{ruleCount} / 5</div>
                          <div className={`text-[10px] ${ruleColor}`}>{rulePct}%</div>
                        </td>
                        <td className={`px-4 py-3 text-right font-mono font-bold ${t.pnl > 0 ? 'text-profit' : t.pnl < 0 ? 'text-loss' : 'text-textMain'}`}>{t.pnl > 0 ? '+' : ''}{formatMoney(t.pnl)}</td>
                        <td className="px-4 py-3 flex justify-end gap-3 text-textMuted">
                          <button onClick={() => handleEdit(t)} className="hover:text-accent transition-colors">Edit</button>
                          <button onClick={() => handleDelete(t.id)} className="hover:text-accent transition-colors"><Icons.Trash /></button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {/* Modal */}
          {showModal && (
            <div className="fixed inset-0 bg-black/80 z-50 flex justify-center items-start md:items-center p-0 md:p-4 overflow-y-auto">
              <div className="bg-bgPanel w-full max-w-2xl border-x md:border border-bgBorder md:rounded-md flex flex-col min-h-screen md:min-h-0 md:max-h-[90vh]">
                <div className="p-4 border-b border-bgBorder flex justify-between items-center sticky top-0 bg-bgPanel z-10">
                  <h3 className="font-bold text-textMain uppercase tracking-wider">{editingId ? 'Edit Trade' : 'New Trade'}</h3>
                  <button type="button" onClick={() => setShowModal(false)} className="text-textMuted hover:text-textMain text-xl leading-none">&times;</button>
                </div>
                
                <div className="p-4 md:p-6 overflow-y-auto flex-1">
                  <form id="tradeForm" onSubmit={handleSave} className="space-y-6">
                    
                    <div className="grid grid-cols-2 gap-4">
                      <div><label className="block text-xs text-textMuted mb-1">Date</label><input type="date" required className="w-full bg-bgMain border border-bgBorder rounded p-2 text-sm text-textMain focus:border-accent outline-none" value={form.date} onChange={e=>setForm({...form, date:e.target.value})}/></div>
                      <TimePicker label="Time" value={time12} onChange={setTime12} />
                      <div><label className="block text-xs text-textMuted mb-1">Pair</label><select className="w-full bg-bgMain border border-bgBorder rounded p-2 text-sm text-textMain" value={form.pair} onChange={e=>setForm({...form, pair:e.target.value})}>{PAIR_OPTS.map(p=><option key={p}>{p}</option>)}</select></div>
                      <div>
                        <label className="block text-xs text-textMuted mb-1">Direction</label>
                        <select className="w-full bg-bgMain border border-bgBorder rounded p-2 text-sm text-textMain focus:border-accent outline-none" value={form.direction} onChange={e=>setForm({...form, direction:e.target.value})}>
                          <option value="BUY">BUY</option>
                          <option value="SELL">SELL</option>
                        </select>
                      </div>
                      <div><label className="block text-xs text-textMuted mb-1">Session</label><select className="w-full bg-bgMain border border-bgBorder rounded p-2 text-sm text-textMain" value={form.session} onChange={e=>setForm({...form, session:e.target.value})}><option>Asia</option><option>London</option><option>New York</option></select></div>
                    </div>
                    
                    <div className="border-t border-bgBorder pt-4 grid grid-cols-2 gap-4">
                      <div><label className="block text-xs text-textMuted mb-1">Entry Price *</label><input type="number" step="any" required className="w-full bg-bgMain border border-bgBorder rounded p-2 text-sm text-textMain focus:border-accent outline-none font-mono" value={form.entry} onChange={e=>setForm({...form, entry:e.target.value})}/></div>
                      <div><label className="block text-xs text-textMuted mb-1">Exit Price</label><input type="number" step="any" className="w-full bg-bgMain border border-bgBorder rounded p-2 text-sm text-textMain focus:border-accent outline-none font-mono" value={form.exit} onChange={e=>setForm({...form, exit:e.target.value})}/></div>
                      <div><label className="block text-xs text-textMuted mb-1">Stop Loss (SL)</label><input type="number" step="any" className="w-full bg-bgMain border border-bgBorder rounded p-2 text-sm text-textMain focus:border-accent outline-none font-mono" value={form.sl} onChange={e=>setForm({...form, sl:e.target.value})}/></div>
                      <div><label className="block text-xs text-textMuted mb-1">Take Profit (TP)</label><input type="number" step="any" className="w-full bg-bgMain border border-bgBorder rounded p-2 text-sm text-textMain focus:border-accent outline-none font-mono" value={form.tp} onChange={e=>setForm({...form, tp:e.target.value})}/></div>
                      <div><label className="block text-xs text-textMuted mb-1">Lot Size</label><input type="number" step="any" className="w-full bg-bgMain border border-bgBorder rounded p-2 text-sm text-textMain focus:border-accent outline-none font-mono" value={form.lotSize} onChange={e=>setForm({...form, lotSize:e.target.value})}/></div>
                      <div><label className="block text-xs text-textMuted mb-1">P&L ($) *</label><input type="number" step="0.01" required className="w-full bg-bgMain border border-bgBorder rounded p-2 text-sm text-textMain focus:border-accent outline-none font-mono" value={form.pnl} onChange={e=>setForm({...form, pnl:e.target.value})}/></div>
                    </div>

                    <div className="border-t border-bgBorder pt-6">
                      <h3 className="text-sm font-bold text-textMain uppercase tracking-wider mb-4">Pre-Trade Checklist</h3>
                      
                      <div className="bg-[#11161D] p-4 rounded-md border border-bgBorder mb-4 shadow-sm">
                        <div className="flex justify-between items-end mb-3">
                          <div>
                            <div className={`text-2xl font-bold font-mono ${textColor}`}>{followedCount} <span className="text-sm text-textDark">/ 5</span></div>
                            <div className="text-[10px] text-textMuted uppercase font-bold tracking-widest mt-1">Rules Followed</div>
                          </div>
                          <div className="text-right">
                            <div className={`text-2xl font-bold font-mono ${textColor}`}>{compliancePct}%</div>
                            {followedCount < 5 && <div className="text-loss text-[10px] uppercase font-bold mt-1">⚠ Rules Violated: {5 - followedCount}</div>}
                            {followedCount === 5 && <div className="text-profit text-[10px] uppercase font-bold mt-1">100% Compliant</div>}
                          </div>
                        </div>
                        <div className="h-2 w-full bg-bgMain rounded-full overflow-hidden border border-[#080A0D]">
                          <div className={`h-full ${barColor} transition-all duration-300`} style={{width: `${compliancePct}%`}}></div>
                        </div>
                      </div>

                      <div className="space-y-2">
                        {CHECKLIST_RULES.map((rule) => (
                          <label key={rule.key} className={`flex items-start gap-3 p-3 bg-bgMain border rounded cursor-pointer transition-colors select-none ${form.checklist[rule.key] ? 'border-accent/40 bg-accent/5' : 'border-bgBorder hover:border-textDark'}`}>
                            <div className="pt-0.5">
                              <input
                                type="checkbox"
                                style={{'--checkbox-color': followedCount === 4 && !form.checklist[rule.key] ? '#00FFB2' : '#00E5FF'}}
                                checked={form.checklist[rule.key]}
                                onChange={(e) => setForm({
                                  ...form,
                                  checklist: { ...form.checklist, [rule.key]: e.target.checked }
                                })}
                              />
                            </div>
                            <div className="flex-1">
                              <div className={`text-sm ${form.checklist[rule.key] ? 'text-textMain' : 'text-textMuted'}`}>{rule.title}</div>
                              {rule.sub && <div className="text-[10px] text-textDark whitespace-pre-line mt-1 font-mono uppercase">{rule.sub}</div>}
                            </div>
                          </label>
                        ))}
                      </div>
                    </div>

                    <div className="border-t border-bgBorder pt-6">
                      <h3 className="text-sm font-bold text-textMain uppercase tracking-wider mb-2">Trade Justification</h3>
                      <label className="block text-xs text-textMuted mb-2">Why am I taking this trade? (Optional)</label>
                      <textarea 
                        rows="3" 
                        className="w-full bg-bgMain border border-bgBorder rounded p-3 text-sm text-textMain focus:border-accent outline-none resize-none" 
                        value={form.justification} 
                        onChange={e=>setForm({...form, justification:e.target.value})}
                        placeholder="Market context, confluences, psychological state..."
                      ></textarea>
                    </div>

                    <div className="border-t border-bgBorder pt-6">
                      <h3 className="text-sm font-bold text-textMain uppercase tracking-wider mb-4">Post-Trade Review</h3>
                      <label className="block text-xs text-textMuted mb-2">Mistakes</label>
                      <div className="flex flex-wrap gap-2 mb-4">
                        {MISTAKE_OPTS.map(m => (
                          <button type="button" key={m} onClick={()=>toggleMistake(m)} className={`px-3 py-1.5 text-xs rounded border transition-colors ${form.mistakes.includes(m) ? 'bg-[#2A1519] border-loss text-loss' : 'bg-bgMain border-bgBorder text-textMuted hover:border-textDark'}`}>{m}</button>
                        ))}
                      </div>
                      <label className="block text-xs text-textMuted mb-1">Post-Trade Notes / Lessons</label>
                      <textarea rows="3" className="w-full bg-bgMain border border-bgBorder rounded p-3 text-sm text-textMain focus:border-accent outline-none resize-none" value={form.notes} onChange={e=>setForm({...form, notes:e.target.value})}></textarea>
                    </div>
                    
                  </form>
                </div>
                
                <div className="p-4 border-t border-bgBorder flex justify-end gap-3 bg-[#11161D] md:rounded-b-md sticky bottom-0 z-10">
                  <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2 text-sm font-bold text-textMuted hover:text-textMain transition-colors">Cancel</button>
                  <button type="submit" form="tradeForm" className="bg-accent hover:bg-[#00cce6] text-[#080A0D] px-6 py-2 rounded text-sm font-bold shadow-[0_0_15px_rgba(0,229,255,0.2)] transition-all">Save Trade</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- CALENDAR ---
    const CalendarView = ({ trades }) => {
      const today = new Date();
      const year = today.getFullYear(); 
      const month = today.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDay = new Date(year, month, 1).getDay();
      
      const calendarDays = Array.from({ length: 42 }, (_, i) => {
        const dayNum = i - firstDay + 1;
        if (dayNum > 0 && dayNum <= daysInMonth) {
          const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
          const dayTrades = trades.filter(t => t.date === dateStr);
          const pnl = dayTrades.reduce((sum, t) => sum + t.pnl, 0);
          return { num: dayNum, date: dateStr, trades: dayTrades.length, pnl };
        }
        return null;
      });

      return (
        <div className="space-y-4 h-full flex flex-col">
          <h2 className="text-lg font-semibold uppercase tracking-wider text-textMain mb-2">August 2026 Calendar</h2>
          
          <div className="grid grid-cols-7 gap-2 md:gap-4">
            {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => (
              <div key={d} className="text-center text-[10px] md:text-xs font-medium text-textMuted uppercase py-2 bg-bgPanel rounded-md border border-bgBorder">
                {d}
              </div>
            ))}
          </div>
          
          <div className="grid grid-cols-7 gap-2 md:gap-4 flex-1 pb-4">
            {calendarDays.map((d, i) => {
              let cardStyle = "border-transparent bg-transparent";
              let pnlColor = "text-textMain";
              let tradeTextColor = "text-textDark";

              if (d) {
                if (d.trades === 0) {
                  cardStyle = "bg-bgPanel border-bgBorder";
                } else if (d.pnl > 0) {
                  cardStyle = "bg-[#00FFB2]/10 border-[#00FFB2]/60";
                  pnlColor = "text-profit";
                  tradeTextColor = "text-profit/80";
                } else if (d.pnl < 0) {
                  cardStyle = "bg-[#FF4D67]/10 border-[#FF4D67]/60";
                  pnlColor = "text-loss";
                  tradeTextColor = "text-loss/80";
                } else {
                  cardStyle = "bg-bgPanel border-bgBorder";
                }
              }

              return (

    // --- ANALYTICS MODULE ---

      // 1. Day of Week Analysis

      }));

      trades.forEach(t => {
        const [y, m, d] = t.date.split('-');
        const dateObj = new Date(y, m - 1, d);
        const dayIdx = dateObj.getDay();
        const stat = dayStats[dayIdx];

        stat.trades++;
        if (t.pnl > 0) stat.wins++;
        if (t.pnl < 0) stat.losses++;
        stat.totalPnl += t.pnl;
        if (t.pnl > stat.maxPnl) stat.maxPnl = t.pnl;
        if (t.pnl < stat.minPnl) stat.minPnl = t.pnl;

        if (t.r !== undefined && t.r !== null && t.r !== '') {
          stat.rSum += parseFloat(t.r);
          stat.rCount++;
        }
      });

      const processedDays = dayStats.map(stat => {
        const winRate = stat.trades > 0 ? ((stat.wins / stat.trades) * 100) : 0;
        const avgPnl = stat.trades > 0 ? (stat.totalPnl / stat.trades) : 0;
        const avgR = stat.rCount > 0 ? (stat.rSum / stat.rCount) : null;
        return { ...stat, winRate, avgPnl, avgR };
      });

      const displayDays = processedDays.slice(1, 6);

      const activeDays = displayDays.filter(d => d.trades > 0);
      let bestDay = null;
      let worstDay = null;
      if (activeDays.length > 0) {
        bestDay = [...activeDays].sort((a,b) => b.totalPnl - a.totalPnl)[0];
        worstDay = [...activeDays].sort((a,b) => a.totalPnl - b.totalPnl)[0];

      let sNewYork = { id: 'NewYork', name: 'New York Session', trades: 0, wins: 0, losses: 0, pnl: 0, maxPnl: -Infinity, minPnl: Infinity, grossWin: 0, grossLoss: 0, color: '#6366F1' };

      const ranges = [];

         ranges.push({ ref: sAsia, start: toMinutes(sessionSettings.sessions.Asia.start), end: toMinutes(sessionSettings.sessions.Asia.end) });
         ranges.push({ ref: sLondon, start: toMinutes(sessionSettings.sessions.London.start), end: toMinutes(sessionSettings.sessions.London.end) });
         ranges.push({ ref: sNewYork, start: toMinutes(sessionSettings.sessions.NewYork.start), end: toMinutes(sessionSettings.sessions.NewYork.end) });

            if (t.pnl > 0) { matchedSession.wins++; matchedSession.grossWin += t.pnl; }
            if (t.pnl < 0) { matchedSession.losses++; matchedSession.grossLoss += Math.abs(t.pnl); }
            if (t.pnl > matchedSession.maxPnl) matchedSession.maxPnl = t.pnl;

                        </thead>
                        <tbody className="divide-y divide-bgBorder text-textMain">
                          {sessionStatsList.map(s => (

                              <td className={`px-4 py-4 text-right font-mono font-bold ${s.trades > 0 ? getStatColor(s.pnl) : 'text-textDark'}`}>{s.trades > 0 ? formatMoney(s.pnl) : 'No Data'}</td>
                              <td className={`px-4 py-4 text-right font-mono ${s.trades > 0 ? getStatColor(s.avgPnl) : 'text-textDark'}`}>{s.trades > 0 ? formatMoney(s.avgPnl) : 'No Data'}</td>
                              <td className={`px-4 py-4 text-right font-mono ${s.trades > 0 ? getStatColor(s.maxPnl) : 'text-textDark'}`}>{s.trades > 0 ? formatMoney(s.maxPnl) : 'No Data'}</td>
                              <td className={`px-4 py-4 text-right font-mono ${s.trades > 0 ? getStatColor(s.minPnl) : 'text-textDark'}`}>{s.trades > 0 ? formatMoney(s.minPnl) : 'No Data'}</td>
                              <td className={`px-4 py-4 text-right font-mono ${s.trades > 0 ? 'text-accent' : 'text-textDark'}`}>{s.trades > 0 ? s.pf : 'No Data'}</td>
                            </tr>
                          ))}
                          <tr className="bg-[#11161D] font-bold">
                            <td className="px-4 py-4 text-textMain">TOTAL</td>
                            <td className="px-4 py-4">{totalSessTrades}</td>
                            <td className="px-4 py-4">{totalSessTrades > 0 ? `${totalSessWinRate.toFixed(0)}%` : '0%'}</td>
                            <td className={`px-4 py-4 text-right font-mono ${totalSessTrades > 0 ? getStatColor(totalSessPnl) : 'text-textDark'}`}>{totalSessTrades > 0 ? formatMoney(totalSessPnl) : 'No Data'}</td>
                            <td className={`px-4 py-4 text-right font-mono ${totalSessTrades > 0 ? getStatColor(totalSessAvgPnl) : 'text-textDark'}`}>{totalSessTrades > 0 ? formatMoney(totalSessAvgPnl) : 'No Data'}</td>
                            <td className={`px-4 py-4 text-right font-mono ${totalSessTrades > 0 ? getStatColor(totalSessMax) : 'text-textDark'}`}>{totalSessTrades > 0 ? formatMoney(totalSessMax) : 'No Data'}</td>
                            <td className={`px-4 py-4 text-right font-mono ${totalSessTrades > 0 ? getStatColor(totalSessMin) : 'text-textDark'}`}>{totalSessTrades > 0 ? formatMoney(totalSessMin) : 'No Data'}</td>
                            <td className={`px-4 py-4 text-right font-mono ${totalSessTrades > 0 ? 'text-accent' : 'text-textDark'}`}>{totalSessTrades > 0 ? totalSessPf : 'No Data'}</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <div className="bg-bgPanel border border-bgBorder rounded-md flex flex-col shadow-sm">
                    <div className="p-4 border-b border-bgBorder text-sm font-medium uppercase text-textMain">Session Distribution</div>
                    <div className="p-6 flex flex-col items-center justify-center flex-1">
                      
                      <div className="relative w-40 h-40 shrink-0 flex items-center justify-center mb-8">
                        {totalSessTrades === 0 ? (
                          <div className="absolute inset-0 flex items-center justify-center rounded-full border-[12px] border-[#11161D]">
                            <span className="text-xs text-textMuted">No Data</span>
                          </div>
                        ) : (
                          <svg className="w-full h-full transform -rotate-90">
                            <circle cx="80" cy="80" r="64" stroke="#11161D" strokeWidth="12" fill="none" />
                            {sessionStatsList.map((s) => {
                              if(s.trades === 0) return null;
                              const pct = s.trades / totalSessTrades;
                              const dash = pct * cSessDonut;
                              const offset = -(cumPercent * cSessDonut);
                              cumPercent += pct;
                              return (
                                <circle key={`donut-${s.id}`} cx="80" cy="80" r="64" stroke={s.color} strokeWidth="12" fill="none"
                                  strokeDasharray={`${dash} ${cSessDonut - dash}`}
                                  strokeDashoffset={offset}
                                  className="transition-all duration-500" />
                              )
                            })}
                          </svg>
                        )}
                        
                        {totalSessTrades > 0 && (
                          <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
                            <span className="text-[10px] text-textMuted uppercase mb-1">Total Trades</span>
                            <span className="text-xl font-bold font-mono text-textMain">{totalSessTrades}</span>
                          </div>
                        )}
                      </div>

                      <div className="w-full space-y-3">
                        {sessionStatsList.map(s => {
                          const pct = totalSessTrades > 0 ? ((s.trades / totalSessTrades) * 100).toFixed(1) : 0;

                            <div key={`legend-${s.id}`} className="flex justify-between items-center text-sm">

                                <span className={s.trades > 0 ? 'text-textMain' : 'text-textMuted'}>{s.name}</span>

                              <span className={`font-mono ${s.trades > 0 ? 'text-textMuted' : 'text-textDark'}`}>

                <div className="bg-bgPanel border border-bgBorder rounded-md p-5 flex flex-col md:flex-row gap-6 divide-y md:divide-y-0 md:divide-x divide-bgBorder shadow-sm">
                  <div className="flex-1 md:pr-4 pt-2 md:pt-0">

                        <p className="text-sm text-textMain mb-1">Your best performing session is</p>
                        <p className="text-base font-bold text-accent">{bestPnlSession.name} <span className="text-textMain font-normal">with</span> <span className={`font-mono ${bestPnlSession.pnl > 0 ? 'text-profit' : 'text-loss'}`}>{formatMoney(bestPnlSession.pnl)}</span> <span className="text-textMain font-normal">P&L</span></p>
                      </>
                    ) : <p className="text-sm font-mono text-textDark">No Data</p>}

                  <div className="flex-1 md:px-6 pt-4 md:pt-0">
                    <h4 className="text-[10px] text-textMuted uppercase tracking-widest mb-3">Highest Win Rate</h4>
                    {bestWrSession ? (
                      <>
                        <p className="text-sm text-textMain mb-1">Highest win rate in</p>
                        <p className="text-base font-bold text-accent">{bestWrSession.name} <span className="font-mono text-textMain font-normal">({bestWrSession.winRate.toFixed(0)}%)</span></p>
                      </>

                  <div className="flex-1 md:pl-6 pt-4 md:pt-0">

                    {mostActiveSession ? (
                      <>
                        <p className="text-sm text-textMain mb-1">Most active session is</p>
                        <p className="text-base font-bold text-accent">{mostActiveSession.name} <span className="font-mono text-textMain font-normal">({mostActiveSession.trades} trades)</span></p>
                      </>
                    ) : <p className="text-sm font-mono text-textDark">No Data</p>}
                  </div>
                </div>
